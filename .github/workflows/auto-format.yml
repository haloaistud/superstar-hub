name: Auto Organize & Format

on:
  push:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Format Code (Prettier)
        run: |
          npx prettier --write .

      - name: Commit Changes Automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and organize files"
          
