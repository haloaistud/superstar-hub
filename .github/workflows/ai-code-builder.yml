name: Automated Codebase Builder

on:
  pull_request:
    types: [opened, synchronize]

# Automatically grants exact read/write permissions at the workflow level
permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Analyze PR and generate full-stack code
        # The previous pinned ref `@v1` failed to resolve on the runner.
        # Use `@main` as a temporary valid ref; pin to a release tag or commit SHA
        # once a stable release is available in the action repo.
        uses: google-github-actions/run-gemini-cli@main
        with:
          # Uses repository secret if available; falls back to placeholder value
          gemini_api_key: ${{ secrets.GEMINI_API_KEY || 'YOUR_GEMINI_API_KEY_PLACEHOLDER' }}
          prompt: |
            Analyze the changes in this pull request and the overall repository context.
            Generate and write the full-stack code necessary to fulfill the requested updates.
            Ensure standard project structure, formatting, and tests are updated or created.

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: automated full-stack build updates"
          branch: ${{ github.event.pull_request.head.ref }}
